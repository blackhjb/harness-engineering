# .codex/config.toml — Codex project settings for the Hunter Harness.
# Subagent definitions live in .codex/agents/*.toml (generated by tools/sync-codex.sh).

# Codex 경로는 모델을 고정한다 (사용자 결정 2026-09-02): gpt-5.6-luna + reasoning max.
# 모델은 에이전트 TOML 이 각자 들고 있고(생성기가 방출), 추론 강도는 여기가 정본이다 —
# `reasoning_effort` 는 agent TOML 의 유효 키가 아니라서(2026-09-02 통제군 대조로 확인)
# 에이전트별로 줄 수 없다. Claude 경로의 `model:` 별칭 티어링은 Codex 에 적용되지 않는다.
model = "gpt-5.6-luna"
model_reasoning_effort = "max"

[agents]
max_threads = 6
max_depth = 1

# MCP 경유는 네이티브 스킬 미지원 클라이언트용 폴백 — Codex에서는 불필요
# (Codex 2025-12+ 는 .agents/skills 를 네이티브로 발견하므로 아래 블록은 보통 필요 없다.)
# [mcp_servers.harness_skills]
# command = "npx"
# args = ["-y", "skills-mcp", "-s", "plugins/harness/skills"]
